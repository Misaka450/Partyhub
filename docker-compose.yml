services:
  # =========================================================================
  # 🎮 PartyHub 聚会游戏大厅主服务
  # =========================================================================
  partyhub:
    image: node:22-alpine
    container_name: draw-guess-game
    working_dir: /app
    volumes:
      - .:/app
    command: node server.js
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - CORS_ORIGIN=*
      - TURN_URL=turn:134.185.118.48:3478
      - TURN_USERNAME=partyhub
      - TURN_CREDENTIAL=partyhub_secret_2026
    depends_on:
      - coturn

  # =========================================================================
  # 🎙️ Coturn 高性能 WebRTC STUN/TURN 语音中继服务
  # 用于在复杂网络（如手机4G/5G、校园网、公司内网对称NAT）下中继玩家之间的语音数据
  # =========================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: partyhub-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--listening-port=3478"
      - "--listening-ip=0.0.0.0"
      - "--external-ip=134.185.118.48"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=partyhub.local"
      - "--user=partyhub:partyhub_secret_2026"
